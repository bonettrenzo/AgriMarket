<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1500" height="980" viewBox="0 0 1500 980"><title>AgriMarket · 03-user-flow.svg</title><rect x="0" y="0" width="1500" height="980" rx="0" fill="#f7f8f3" stroke="#f7f8f3"/><rect x="0" y="0" width="1500" height="140" rx="0" fill="#263f2c" stroke="#263f2c"/><text x="48" y="43" fill="#e5edb5" font-family="Arial, sans-serif" font-size="13" font-weight="700">AGRIMARKET / DISEÑO DE EXPERIENCIA / 03</text><text x="48" y="87" fill="white" font-family="Arial, sans-serif" font-size="34" font-weight="700">User Flow / Del descubrimiento al contacto</text><text x="48" y="118" fill="#d1dec7" font-family="Arial, sans-serif" font-size="15" font-weight="400">Dos roles, un objetivo: facilitar el comercio directo · Flujo del prototipo HTML</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m0 0 8 4-8 4" fill="#718665"/></marker></defs><text x="48" y="195" fill="#263f2c" font-family="Arial, sans-serif" font-size="16" font-weight="700">COMPRADOR / MARÍA</text><rect x="48" y="222" width="244" height="105" rx="12" fill="white" stroke="#e3e7dc"/><text x="66" y="255" fill="#263f2c" font-family="Arial, sans-serif" font-size="17" font-weight="700">Catálogo público</text><text x="66" y="283" fill="#667064" font-family="Arial, sans-serif" font-size="13" font-weight="400">Buscar por nombre, categoría</text><text x="66" y="303" fill="#667064" font-family="Arial, sans-serif" font-size="13" font-weight="400">y municipio.</text><rect x="340" y="222" width="244" height="105" rx="12" fill="white" stroke="#e3e7dc"/><text x="358" y="255" fill="#263f2c" font-family="Arial, sans-serif" font-size="17" font-weight="700">Detalle de cosecha</text><text x="358" y="283" fill="#667064" font-family="Arial, sans-serif" font-size="13" font-weight="400">Ver origen, precio, unidad y</text><text x="358" y="303" fill="#667064" font-family="Arial, sans-serif" font-size="13" font-weight="400">disponibilidad.</text><rect x="632" y="222" width="244" height="105" rx="12" fill="white" stroke="#e3e7dc"/><text x="650" y="255" fill="#263f2c" font-family="Arial, sans-serif" font-size="17" font-weight="700">Revisar solicitud</text><text x="650" y="283" fill="#667064" font-family="Arial, sans-serif" font-size="13" font-weight="400">Cantidad válida, nombre y</text><text x="650" y="303" fill="#667064" font-family="Arial, sans-serif" font-size="13" font-weight="400">mensaje opcional.</text><rect x="924" y="222" width="244" height="105" rx="12" fill="white" stroke="#e3e7dc"/><text x="942" y="255" fill="#263f2c" font-family="Arial, sans-serif" font-size="17" font-weight="700">Mensaje preparado</text><text x="942" y="283" fill="#667064" font-family="Arial, sans-serif" font-size="13" font-weight="400">Revisar resumen y abrir</text><text x="942" y="303" fill="#667064" font-family="Arial, sans-serif" font-size="13" font-weight="400">WhatsApp.</text><path d="M292 274 L340 274" stroke="#718665" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M584 274 L632 274" stroke="#718665" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M876 274 L924 274" stroke="#718665" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="1210" y="222" width="242" height="105" rx="12" fill="white" stroke="#e3e7dc"/><text x="1228" y="255" fill="#263f2c" font-family="Arial, sans-serif" font-size="17" font-weight="700">Acuerdo directo</text><text x="1228" y="283" fill="#667064" font-family="Arial, sans-serif" font-size="13" font-weight="400">Elegir contacto de prueba;</text><text x="1228" y="303" fill="#667064" font-family="Arial, sans-serif" font-size="13" font-weight="400">entrega y pago a convenir.</text><path d="M1168 274 L1210 274" stroke="#718665" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="48" y="368" width="1404" height="92" rx="12" fill="#edf2e6" stroke="#e3e7dc"/><text x="70" y="400" fill="#263f2c" font-family="Arial, sans-serif" font-size="17" font-weight="700">Rutas de recuperación</text><text x="70" y="429" fill="#667064" font-family="Arial, sans-serif" font-size="15" font-weight="400">Sin resultados → Limpiar filtros. Cantidad inválida → Corregir. Producto retirado → Volver al catálogo. Solicitud → Cambiar cantidad.</text><text x="48" y="526" fill="#263f2c" font-family="Arial, sans-serif" font-size="16" font-weight="700">PRODUCTOR / DON JOSÉ</text><rect x="48" y="553" width="242" height="105" rx="12" fill="white" stroke="#e3e7dc"/><text x="66" y="586" fill="#263f2c" font-family="Arial, sans-serif" font-size="17" font-weight="700">Registro / Acceso</text><text x="66" y="614" fill="#667064" font-family="Arial, sans-serif" font-size="13" font-weight="400">Seleccionar perfil de</text><text x="66" y="634" fill="#667064" font-family="Arial, sans-serif" font-size="13" font-weight="400">productor y entrar a la demo.</text><rect x="340" y="553" width="242" height="105" rx="12" fill="white" stroke="#e3e7dc"/><text x="358" y="586" fill="#263f2c" font-family="Arial, sans-serif" font-size="17" font-weight="700">Panel principal</text><text x="358" y="614" fill="#667064" font-family="Arial, sans-serif" font-size="13" font-weight="400">Ver cosechas y resumen de</text><text x="358" y="634" fill="#667064" font-family="Arial, sans-serif" font-size="13" font-weight="400">solicitudes.</text><rect x="632" y="553" width="242" height="105" rx="12" fill="white" stroke="#e3e7dc"/><text x="650" y="586" fill="#263f2c" font-family="Arial, sans-serif" font-size="17" font-weight="700">Publicar cosecha</text><text x="650" y="614" fill="#667064" font-family="Arial, sans-serif" font-size="13" font-weight="400">Foto, categoría, precio,</text><text x="650" y="634" fill="#667064" font-family="Arial, sans-serif" font-size="13" font-weight="400">unidad, stock y ubicación.</text><rect x="924" y="553" width="242" height="105" rx="12" fill="white" stroke="#e3e7dc"/><text x="942" y="586" fill="#263f2c" font-family="Arial, sans-serif" font-size="17" font-weight="700">Mis productos</text><text x="942" y="614" fill="#667064" font-family="Arial, sans-serif" font-size="13" font-weight="400">Publicación visible. Editar</text><text x="942" y="634" fill="#667064" font-family="Arial, sans-serif" font-size="13" font-weight="400">precio y disponibilidad.</text><rect x="1210" y="553" width="242" height="105" rx="12" fill="white" stroke="#e3e7dc"/><text x="1228" y="586" fill="#263f2c" font-family="Arial, sans-serif" font-size="17" font-weight="700">Retirar cosecha</text><text x="1228" y="614" fill="#667064" font-family="Arial, sans-serif" font-size="13" font-weight="400">Confirmar la eliminación y</text><text x="1228" y="634" fill="#667064" font-family="Arial, sans-serif" font-size="13" font-weight="400">volver al listado.</text><path d="M290 605 L340 605" stroke="#718665" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M582 605 L632 605" stroke="#718665" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M874 605 L924 605" stroke="#718665" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M1166 605 L1216 605" stroke="#718665" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M1045 658 L1045 748" stroke="#718665" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="924" y="750" width="244" height="105" rx="12" fill="white" stroke="#e3e7dc"/><text x="942" y="783" fill="#263f2c" font-family="Arial, sans-serif" font-size="17" font-weight="700">Actualizar publicación</text><text x="942" y="811" fill="#667064" font-family="Arial, sans-serif" font-size="13" font-weight="400">Guardar cambios y volver al</text><text x="942" y="831" fill="#667064" font-family="Arial, sans-serif" font-size="13" font-weight="400">listado.</text><rect x="48" y="745" width="800" height="116" rx="12" fill="#fbede5" stroke="#e3e7dc"/><text x="70" y="780" fill="#98401e" font-family="Arial, sans-serif" font-size="18" font-weight="700">Límite del prototipo</text><text x="70" y="810" fill="#667064" font-family="Arial, sans-serif" font-size="15" font-weight="400">Autenticación y operaciones simuladas en el navegador. No hay pagos en línea, logística,</text><text x="70" y="834" fill="#667064" font-family="Arial, sans-serif" font-size="15" font-weight="400">envío automático de mensajes ni confirmación de ventas.</text><text x="48" y="930" fill="#667064" font-family="Arial, sans-serif" font-size="16" font-weight="400">Figma: importar los SVG y conectar frames según este flujo. El archivo nativo y sus conexiones aún deben crearse.</text></svg>