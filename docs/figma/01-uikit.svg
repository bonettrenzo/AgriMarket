ily="Arial, sans-serif" font-size="17" font-weight="700">Lino</text><text x="720" y="370" fill="#667064" font-family="Arial, sans-serif" font-size="14" font-weight="400">#f7f8f3</text><rect x="944" y="214" width="204" height="100" rx="12" fill="#28352b" stroke="#28352b"/><text x="944" y="344" fill="#28352b" font-family="Arial, sans-serif" font-size="17" font-weight="700">Tinta</text><text x="944" y="370" fill="#667064" font-family="Arial, sans-serif" font-size="14" font-weight="400">#28352b</text><rect x="1168" y="214" width="204" height="100" rx="12" fill="#667064" stroke="#667064"/><text x="1168" y="344" fill="#28352b" font-family="Arial, sans-serif" font-size="17" font-weight="700">Secundario</text><text x="1168" y="370" fill="#667064" font-family="Arial, sans-serif" font-size="14" font-weight="400">#667064</text><text x="48" y="425" fill="#667064" font-family="Arial, sans-serif" font-size="13" font-weight="700">02 / TIPOGRAFÍA</text><text x="48" y="480" fill="#263f2c" font-family="Arial, sans-serif" font-size="36" font-weight="700">Lo mejor del campo, cerca de ti.</text><text x="48" y="524" fill="#28352b" font-family="Arial, sans-serif" font-size="24" font-weight="700">Una cosecha, muchas conexiones.</text><text x="48" y="560" fill="#667064" font-family="Arial, sans-serif" font-size="17" font-weight="400">Avenir Next → Segoe UI → Arial. Fuente del sistema, sin descarga externa.</text><text x="48" y="594" fill="#667064" font-family="Arial, sans-serif" font-size="15" font-weight="400">Título 32 px / Sección 22 px / Cuerpo 15 px / Etiqueta 12 px. Interlineado de cuerpo 1.55.</text><text x="48" y="654" fill="#667064" font-family="Arial, sans-serif" font-size="13" font-weight="700">03 / ACCIONES Y ESTADOS</text><rect x="48" y="678" width="190" height="48" rx="8" fill="#263f2c" stroke="#263f2c"/><text x="66" y="708" fill="white" font-family="Arial, sans-serif" font-size="15" font-weight="600">Solicitar al productor</text><rect x="260" y="678" width="190" height="48" rx="8" fill="white" stroke="white"/><text x="278" y="708" fill="#263f2c" font-family="Arial, sans-serif" font-size="15" font-weight="600">Ver producto</text><rect x="472" y="678" width="190" height="48" rx="8" fill="#e5edb5" stroke="#e5edb5"/><text x="490" y="708" fill="#263f2c" font-family="Arial, sans-serif" font-size="15" font-weight="600">Quiero ser productor</text><rect x="684" y="678" width="205" height="48" rx="8" fill="white" stroke="white"/><text x="702" y="708" fill="#ad3434" font-family="Arial, sans-serif" font-size="15" font-weight="600">Retirar publicación</text><rect x="918" y="678" width="240" height="48" rx="8" fill="#edf2e6" stroke="#e3e7dc"/><text x="936" y="708" fill="#263f2c" font-family="Arial, sans-serif" font-size="15" font-weight="600">Producto disponible</text><text x="48" y="788" fill="#667064" font-family="Arial, sans-serif" font-size="13" font-weight="700">04 / CAMPOS Y COMPONENTES</text><text x="48" y="824" fill="#28352b" font-family="Arial, sans-serif" font-size="15" font-weight="600">Nombre del producto</text><rect x="48" y="840" width="350" height="50" rx="8" fill="white" stroke="#bdc8b9"/><text x="63" y="871" fill="#667064" font-family="Arial, sans-serif" font-size="15" font-weight="400">Mango Tommy</text><text x="438" y="824" fill="#28352b" font-family="Arial, sans-serif" font-size="15" font-weight="600">Categorías de selección amplia</text><rect x="438" y="840" width="160" height="58" rx="9" fill="#edf2e6" stroke="#466941"/><text x="480" y="875" fill="#263f2c" font-family="Arial, sans-serif" font-size="15" font-weight="600">Frutas</text><rect x="614" y="840" width="160" height="58" rx="9" fill="white" stroke="#e3e7dc"/><text x="650" y="875" fill="#263f2c" font-family="Arial, sans-serif" font-size="15" font-weight="600">Tubérculos</text><rect x="830" y="814" width="530" height="108" rx="12" fill="white" stroke="#e3e7dc"/><text x="850" y="844" fill="#28352b" font-family="Arial, sans-serif" font-size="20" font-weight="700">Mango Tommy</text><text x="850" y="872" fill="#667064" font-family="Arial, sans-serif" font-size="14" font-weight="400">Ciénaga, Magdalena · José Manuel Pérez</text><text x="850" y="902" fill="#263f2c" font-family="Arial, sans-serif" font-size="17" font-weight="700">$ 2.500 / Kg · 100 Kg disponibles</text><text x="48" y="978" fill="#667064" font-family="Arial, sans-serif" font-size="13" font-weight="700">05 / REGLAS DE COMPOSICIÓN Y ACCESIBILIDAD</text><text x="48" y="1014" fill="#667064" font-family="Arial, sans-serif" font-size="17" font-weight="400">Base de espaciado: 4 px. Espacios principales: 8, 12, 16, 20, 24, 32 y 40 px. Bordes: 8 a 16 px. Controles principales: 44 a 48 px de</text><text x="48" y="1040" fill="#667064" font-family="Arial, sans-serif" font-size="17" font-weight="400">alto. Foco visible, etiquetas persistentes y mensajes sin depender solo del color.</text><text x="48" y="1110" fill="#667064" font-family="Arial, sans-serif" font-size="17" font-weight="400">Escritorio: barra lateral + tres columnas. Tablet: navegación plegable. Móvil: dos columnas; formularios de una columna. Probar con</text><text x="48" y="1136" fill="#667064" font-family="Arial, sans-serif" font-size="17" font-weight="400">teclado, zoom de 200 % y dispositivos reales antes de declarar conformidad.</text></svg>