nt-family="Arial, sans-serif" font-size="15" font-weight="400">Teme formularios extensos y</text><text x="1018" y="649" fill="#28352b" font-family="Arial, sans-serif" font-size="15" font-weight="400">cobros inesperados.</text><text x="1018" y="742" fill="#667064" font-family="Arial, sans-serif" font-size="10" font-weight="700">RESPUESTA DEL DISEÑO</text><text x="1018" y="774" fill="#28352b" font-family="Arial, sans-serif" font-size="15" font-weight="400">Tres etapas, nombre y mensaje</text><text x="1018" y="797" fill="#28352b" font-family="Arial, sans-serif" font-size="15" font-weight="400">opcional.</text><rect x="1320" y="185" width="300" height="710" rx="12" fill="white" stroke="#e3e7dc"/><rect x="1320" y="185" width="300" height="52" rx="12" fill="#e5edb5" stroke="#e5edb5"/><text x="1338" y="218" fill="#263f2c" font-family="Arial, sans-serif" font-size="17" font-weight="700">05 / Contacto</text><text x="1338" y="268" fill="#667064" font-family="Arial, sans-serif" font-size="10" font-weight="700">ACCIÓN</text><text x="1338" y="300" fill="#28352b" font-family="Arial, sans-serif" font-size="15" font-weight="400">Revisa el mensaje y acuerda</text><text x="1338" y="323" fill="#28352b" font-family="Arial, sans-serif" font-size="15" font-weight="400">la compra.</text><text x="1338" y="396" fill="#667064" font-family="Arial, sans-serif" font-size="10" font-weight="700">PUNTO DE CONTACTO</text><text x="1338" y="428" fill="#28352b" font-family="Arial, sans-serif" font-size="15" font-weight="400">WhatsApp / conversación</text><text x="1338" y="494" fill="#667064" font-family="Arial, sans-serif" font-size="10" font-weight="700">EMOCIÓN ESPERADA</text><text x="1338" y="526" fill="#28352b" font-family="Arial, sans-serif" font-size="15" font-weight="400">Entusiasmo</text><text x="1338" y="594" fill="#667064" font-family="Arial, sans-serif" font-size="10" font-weight="700">FRICCIÓN / NECESIDAD</text><text x="1338" y="626" fill="#28352b" font-family="Arial, sans-serif" font-size